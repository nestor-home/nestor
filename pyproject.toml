[build-system]
requires = ["uv_build>=0.13.6,<0.14"]
build-backend = "uv_build"

[project]
name = "nestor-home"
version = "0.12.0"
description = "Open-source framework for intelligent home assistants: fast voice agent, Home Assistant, memory, delegation, initiative and pluggable embodiment."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Mathis Lambert" }]
requires-python = ">=3.12"
dependencies = [
    "aioimaplib>=2.0.3",
    "cryptography>=50.0.2",
    "fastapi>=0.162.0",
    "fluent-runtime>=0.4.0",
    "httpx>=0.28.1",
    "mcp>=2.3",
    "pydantic>=2.12",
    "pypdf>=7.0.1",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "ruamel-yaml>=0.18",
    "sqlite-vec>=0.1.9",
    "uvicorn>=0.54.0",
    "websockets>=17",
]
keywords = ["home assistant", "voice assistant", "agent", "robotics", "home automation"]
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Home Automation",
    "Typing :: Typed",
]

[project.optional-dependencies]
# The voice of satellites (Pipecat cascade, WebRTC, ElevenLabs). Version pinned: it relies on Pipecat
# internals covered by its tests.
voice = ["pipecat-ai[elevenlabs,webrtc]==1.16.0"]
# Who speaks, from their voice (`sherpa-onnx-speaker`): runs a voiceprint model on the CPU, no server. Version pinned:
# the bench calibrated each model's threshold with it.
voice-id = ["sherpa-onnx==2.0.1"]

[project.scripts]
nestor = "nestor.cli:main"

[project.entry-points."nestor.adapters"]
openai-compatible-language = "nestor.adapters.models.openai_compatible:language"
openai-compatible-embedding = "nestor.adapters.models.openai_compatible:embedding"
openai-compatible-image = "nestor.adapters.models.openai_compatible:image"
openai-compatible-transcription = "nestor.adapters.models.openai_compatible:transcription"
openai-compatible-speech = "nestor.adapters.models.openai_compatible:speech"
elevenlabs-transcription = "nestor.adapters.models.elevenlabs:transcription"
elevenlabs-speech = "nestor.adapters.models.elevenlabs:speech"
sherpa-onnx-speaker = "nestor.adapters.models.sherpa_onnx:speaker"
sherpa-onnx-transcription = "nestor.adapters.models.sherpa_onnx:transcription"
hermes = "nestor.adapters.executors.hermes:plugin"
telegram = "nestor.adapters.channels.telegram:plugin"
web = "nestor.adapters.channels.web:plugin"
satellites = "nestor.adapters.channels.satellites:plugin"
home-assistant = "nestor.adapters.home.home_assistant:plugin"
mcp = "nestor.adapters.tools.mcp.plugin:plugin"
brave = "nestor.adapters.tools.brave:plugin"
searxng = "nestor.adapters.tools.searxng:plugin"
tavily = "nestor.adapters.tools.tavily:plugin"
web-pages = "nestor.adapters.tools.web_pages:plugin"
open-meteo = "nestor.adapters.tools.open_meteo:plugin"
openstreetmap = "nestor.adapters.tools.openstreetmap:plugin"
google = "nestor.adapters.connectors.google:plugin"
imap = "nestor.adapters.connectors.imap:plugin"

[project.entry-points."nestor.benches"]
watch-triage = "nestor.bench.suites.watch_triage:suite"
memory-recall = "nestor.bench.suites.memory_recall:suite"
speaker-id = "nestor.bench.suites.speaker_id:suite"
transcription = "nestor.bench.suites.voice:transcription"
speech = "nestor.bench.suites.voice:speech"

[project.urls]
Homepage = "https://nestorhome.dev"
Source = "https://github.com/nestor-home/nestor"
Issues = "https://github.com/nestor-home/nestor/issues"

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "pytest-asyncio==1.5.0",
    "pytest-cov==7.1.0",
    "ruff==0.17.5",
    "ty==0.0.103",
    "pre-commit==4.7.0",
    "types-pyyaml>=6.0.12.20261030",
    "respx>=0.22",
    "jsonschema>=4.26.0",
]

[tool.uv.build-backend]
module-name = "nestor"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = ["--import-mode=importlib", "--cov=nestor", "--cov-report=term-missing:skip-covered", "-m", "not live"]
markers = ["live: calls a real provider (network, keys, cost); run with `pytest -m live`"]

[tool.coverage.run]
branch = true

[tool.coverage.report]
fail_under = 95
exclude_also = ["raise NotImplementedError", "\\.\\.\\.$"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ty.environment]
python-version = "3.12"

[tool.ty.rules]
# Strict by default: an unresolved import or a possibly-unbound name is an error, not a warning.
possibly-unresolved-reference = "error"
