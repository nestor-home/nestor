[build-system]
requires = ["uv_build>=0.13.6,<0.14"]
build-backend = "uv_build"

[project]
name = "nestor-home"
version = "0.0.1"
description = "Open-source framework for intelligent home assistants: fast voice agent, Home Assistant, memory, delegation, initiative and pluggable embodiment."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Mathis Lambert" }]
requires-python = ">=3.12"
dependencies = [
    "aioimaplib>=2.0.3",
    "cryptography>=50.0.2",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "mcp>=2.3",
    "pydantic>=2.12",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "uvicorn>=0.54.0",
    "websockets>=17",
]
keywords = ["home assistant", "voice assistant", "agent", "robotics", "home automation"]
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Home Automation",
    "Typing :: Typed",
]

[project.optional-dependencies]
# Realtime voice channel (Pipecat cascade, WebRTC, ElevenLabs). Version pinned: the channel relies on
# Pipecat internals covered by its tests.
voice = ["pipecat-ai[elevenlabs,webrtc,runner]==1.14.0"]

[project.scripts]
nestor = "nestor.runtime.cli:main"

[project.entry-points."nestor.adapters"]
openai-compatible = "nestor.adapters.models.openai_compatible:plugin"
hermes = "nestor.adapters.executors.hermes:plugin"
telegram = "nestor.adapters.channels.telegram:plugin"
home-assistant = "nestor.adapters.home.home_assistant:plugin"

[project.urls]
Homepage = "https://nestor.mathislambert.fr"
Source = "https://github.com/nestor-home/nestor"
Issues = "https://github.com/nestor-home/nestor/issues"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.1",
    "pytest-cov==7.1.0",
    "ruff==0.17.3",
    "ty==0.0.94",
    "pre-commit==4.7.0",
    "types-pyyaml>=6.0.12.20261030",
    "respx>=0.22",
]

[tool.uv.build-backend]
module-name = "nestor"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = ["--import-mode=importlib", "--cov=nestor", "--cov-report=term-missing:skip-covered", "-m", "not live"]
markers = ["live: calls a real provider (network, keys, cost); run with `pytest -m live`"]

[tool.coverage.run]
branch = true

[tool.coverage.report]
fail_under = 95
exclude_also = ["raise NotImplementedError", "\\.\\.\\.$"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ty.environment]
python-version = "3.12"

[tool.ty.rules]
# Strict by default: an unresolved import or a possibly-unbound name is an error, not a warning.
possibly-unresolved-reference = "error"
