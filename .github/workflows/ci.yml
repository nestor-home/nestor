name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.14"
          enable-cache: true
      - run: uv sync --locked --all-extras
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run ty check

  # The suite in parallel: each Python version in three parts (pytest-split, by the recorded durations of
  # .test_durations), each part on every core of its runner (pytest-xdist). Coverage is measured on the newest version
  # only, and checked once all its parts are in (`coverage`).
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
        group: [1, 2, 3]
    env:
      COVERAGE_FILE: .coverage.${{ matrix.group }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --locked --all-extras
      - if: matrix.python != '3.14'
        run: uv run pytest -n auto --splits 3 --group ${{ matrix.group }} --no-cov
      - if: matrix.python == '3.14'
        run: >-
          uv run pytest -n auto --splits 3 --group ${{ matrix.group }} --cov-report= --cov-fail-under=0
          --store-durations --durations-path durations-${{ matrix.group }}.json
      - if: matrix.python == '3.14'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.group }}
          path: |
            .coverage.${{ matrix.group }}
            durations-${{ matrix.group }}.json
          include-hidden-files: true

  coverage:
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.14"
          enable-cache: true
      - run: uv sync --locked --all-extras
      - uses: actions/download-artifact@v8
        with:
          pattern: coverage-*
          merge-multiple: true
      - run: uv run coverage combine .coverage.*
      - run: uv run coverage report --skip-covered --show-missing

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: mkdir -p .claude/skills && pnpm install --frozen-lockfile  # agent skills folder, git-ignored
      - name: the client is generated from web/openapi.json (the server's tests keep that file current)
        run: pnpm api:generate && git diff --exit-code -- src/api/schema.gen.ts
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build

  web-unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: mkdir -p .claude/skills && pnpm install --frozen-lockfile
      - run: pnpm test --shard=${{ matrix.shard }}/2

  web-e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: mkdir -p .claude/skills && pnpm install --frozen-lockfile
      - name: Playwright's browser, cached by its version
        id: playwright
        run: echo "version=$(pnpm exec playwright --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ steps.playwright.outputs.version }}
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - if: steps.browsers.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium
      - run: pnpm e2e --shard=${{ matrix.shard }}/3

  # `pip install nestor-home` without any extra: `nestor init` writes a text-only configuration (a local
  # model, no key; Telegram asked for), `check` accepts it and `run` serves the admin, with no Pipecat installed.
  text-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"
      - run: uv build --wheel
      - run: uv venv bare && uv pip install --python bare dist/*.whl
      - run: "! bare/bin/python -c 'import pipecat'"
      - name: init, without the voice extra
        # name, first name, language, time zone, model server, model, Telegram, login, password twice
        run: >-
          printf '%s\n' Nestor Ada en UTC http://localhost:11434/v1 llama3.2 y ada long-enough-password
          long-enough-password | bare/bin/nestor -c data/nestor.yaml init
      - run: sed -i 's/^TELEGRAM_BOT_TOKEN=$/TELEGRAM_BOT_TOKEN=123:ci/' data/.env
      - run: bare/bin/nestor -c data/nestor.yaml check
      - name: run serves the admin
        # a Bot API that does not answer: the channel retries as when offline, and Nestor keeps running
        run: |
          sed -i '/# from @BotFather/a\    api_base: http://127.0.0.1:9' data/nestor.yaml
          bare/bin/nestor -c data/nestor.yaml run & pid=$!
          for _ in $(seq 30); do curl -fs http://127.0.0.1:8470/health && break; sleep 1; done
          curl -fs http://127.0.0.1:8470/health
          kill "$pid" && wait "$pid"

  # The image builds, and runs against a root-owned ./data, as Docker creates a missing bind mount: the entrypoint
  # gives the folder to the nestor user (uid 1000), and what init writes is that user's.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: nestor:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: sudo mkdir data && sudo chown root:root data
      - name: init, then check, in the container
        # name, first name, language, time zone, model server, model, no voice (the image has it), no Telegram,
        # login, password twice
        run: |
          printf '%s\n' Nestor Ada en UTC http://localhost:11434/v1 llama3.2 n n ada long-enough-password \
            long-enough-password | docker run -i --rm -v "$PWD/data:/data" nestor:ci init
          docker run --rm -v "$PWD/data:/data" nestor:ci check
      - run: test "$(stat -c %u data)" = 1000 && test "$(stat -c %u data/nestor.yaml)" = 1000

  # The single check the branch rules require.
  ci:
    needs: [lint, test, coverage, web, web-unit, web-e2e, text-only, docker]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
