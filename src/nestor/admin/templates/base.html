<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>{% block title %}Administration{% endblock %} · {{ assistant }}</title>
  <link rel="stylesheet" href="/static/admin.css">
</head>
<body>
  <header class="top">
    <a class="brand" href="/">{{ assistant }}<span>administration</span></a>
    {% if session %}
    <nav aria-label="Sections">
      {% for path, label in navigation %}
      <a href="{{ path }}"{% if here.startswith(path) or (path == "/connections" and here.startswith("/connectors")) %} aria-current="page"{% endif %}>{{ label }}</a>
      {% endfor %}
    </nav>
    <form method="post" action="/logout" class="logout">
      <input type="hidden" name="csrf" value="{{ csrf }}">
      <button type="submit" class="link">Se déconnecter</button>
    </form>
    {% endif %}
  </header>
  <main>
    {% for notice in notices %}
    <p class="notice" role="status">{{ notice }}</p>
    {% endfor %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
