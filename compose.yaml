# docker compose run --rm nestor init   then fill data/.env   then   docker compose up -d
# ./data holds nestor.yaml, its .env (secrets, created by `nestor init`) and the state. Docker creates
# it if missing; the container gives it to its nestor user (uid 1000) before running as that user.
# Nestor reads data/.env itself at every start: after editing it, `docker compose restart` applies it.
services:
  nestor:
    image: ghcr.io/nestor-home/nestor:latest
    build: .
    restart: unless-stopped
    volumes: ["./data:/data"]
    ports:
      - "8470:8470"  # admin
      - "8471:8471"  # voice: satellites and the development browser client
    # A model server on this machine (Ollama, LM Studio…) is http://host.docker.internal:<port>/v1 from
    # the container: `localhost` there is the container itself. Linux needs this line (and the model server
    # listening beyond loopback, e.g. OLLAMA_HOST=0.0.0.0); macOS and Windows define the name already.
    extra_hosts: ["host.docker.internal:host-gateway"]

  # Continuous replication of the database to a NAS or S3 (optional): uncomment and fill litestream.yml.
  # litestream:
  #   image: litestream/litestream  # pin the current release tag
  #   restart: unless-stopped
  #   command: replicate
  #   volumes: ["./data:/data", "./litestream.yml:/etc/litestream.yml:ro"]
